spring:
  application:
    name: railpulse-backend
  
  datasource:
    url: jdbc:postgresql://localhost:5433/railpulse
    username: railpulse
    password: railpulse123
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: railpulse-processor
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      topic: telemetry-stream  # <-- ADDED THIS LINE
    
    streams:
      application-id: railpulse-streams
      properties:
        default.key.serde: org.apache.kafka.common.serialization.Serdes$StringSerde
        default.value.serde: org.apache.kafka.common.serialization.Serdes$StringSerde
        commit.interval.ms: 1000

logging:
  level:
    com.railpulse: INFO
    org.apache.kafka: WARN
    org.hibernate: WARN

railpulse:
  vibration:
    critical-threshold: 8.0
    warning-threshold: 6.0
  speed:
    curve-threshold: 60.0
  archival:
    batch-size: 1000
    interval-seconds: 60

minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin123
  bucket-name: railpulse-lake
  region: us-east-1